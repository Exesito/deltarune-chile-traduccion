name: Build Windows patcher

# Compila patcher.exe en Windows y lo publica.
#  - Al empujar un tag vX.Y.Z  -> crea/actualiza el Release y adjunta el .exe
#  - Manualmente (workflow_dispatch) -> deja el .exe como artefacto descargable
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyInstaller y dependencias del patcher
        run: pip install pyinstaller detools

      - name: Compilar patcher.exe
        working-directory: scripts
        run: pyinstaller --onefile --windowed --name patcher-deltarune-cl --distpath out patcher.py

      - name: Subir como artefacto (siempre)
        uses: actions/upload-artifact@v4
        with:
          name: patcher-deltarune-cl
          path: scripts/out/patcher-deltarune-cl.exe

      - name: Adjuntar al Release (solo en tags)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            scripts/out/patcher-deltarune-cl.exe \
            --title "$GITHUB_REF_NAME" \
            --notes "Parche de traducción ES-CL para Deltarune. Descarga el .exe, ábrelo, elige el capítulo, ubica el juego y dale a PARCHAR." \
          || gh release upload "$GITHUB_REF_NAME" scripts/out/patcher-deltarune-cl.exe --clobber
